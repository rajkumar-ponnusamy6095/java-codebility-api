spring.application.name=java-codebility-api
spring.application.name=project-api
server.port=${PORT:8080}

spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=false
spring.mail.host=smtp.ethereal.email
spring.mail.port=587
spring.mail.username=${ETHEREAL_USER}
spring.mail.password=${ETHEREAL_PASS}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.refresh-token.expiration-ms=604800000
app.cookie.secure=false
app.password-reset.expiration-ms=900000
spring.mvc.servlet.path=/api/v1
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4310,http://localhost:4311}