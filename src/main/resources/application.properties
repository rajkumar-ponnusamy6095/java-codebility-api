spring.application.name=java-codebility-api
server.port=${PORT:8080}
spring.mvc.servlet.path=/api/v1

# MongoDB (MONGODB_URI takes precedence over DB_CONN, as in cinefy)
spring.mongodb.uri=${MONGODB_URI:${DB_CONN:}}
spring.data.mongodb.auto-index-creation=false
app.mongodb.ensure-indexes=${DB_ENSURE_INDEXES:true}
app.mongodb.max-pool-size=${DB_MAX_POOL_SIZE:100}
app.mongodb.min-pool-size=${DB_MIN_POOL_SIZE:0}

# SMTP
spring.mail.host=${SMTP_HOST:smtp.ethereal.email}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:${ETHEREAL_USER:}}
spring.mail.password=${SMTP_PASS:${ETHEREAL_PASS:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${EMAIL_FROM:${spring.mail.username}}

# Auth (access token 15 min, refresh token 7 days)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.refresh-token.expiration-ms=604800000
app.password-reset.expiration-ms=900000
app.password-setup.expiration-ms=86400000
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Frontends: email links use the request Origin if listed in APP_URL
app.name=Codebility
app.url=${APP_URL:http://localhost:4310,http://localhost:4311}
app.cors.allowed-origins=${CORS_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:4310,http://localhost:4311}}
